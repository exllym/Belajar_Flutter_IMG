name: Build Flutter APK

on:
  push:
    branches:
      - eded
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Update Gradle ke 8.14
      - name: Update Gradle
        run: |
          sed -i 's/gradle-[0-9.]*-\(all\|bin\)\.zip/gradle-8.14-\1.zip/' \
            android/gradle/wrapper/gradle-wrapper.properties

      # Update Android Gradle Plugin ke 8.11.1
      - name: Update Android Gradle Plugin
        run: |
          sed -i 's/com.android.application" version "[0-9.]*"/com.android.application" version "8.11.1"/' android/settings.gradle*
          sed -i "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.11.1/" android/build.gradle*

      # Gunakan legacy DSL jika diperlukan
      - name: Configure Android DSL
        run: |
          if ! grep -q "^android.newDsl=" android/gradle.properties; then
            echo "android.newDsl=false" >> android/gradle.properties
          else
            sed -i 's/^android.newDsl=.*/android.newDsl=false/' android/gradle.properties
          fi

      - name: Show versions
        run: |
          echo "=== Gradle ==="
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties || true

          echo "=== AGP ==="
          grep -R "com.android.application" android/settings.gradle* android/build.gradle* || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
